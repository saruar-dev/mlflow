$schema: https://json-schema.org/draft/2020-12/schema
title: Nightly Failure Analysis
type: object
required: [groups]
properties:
  groups:
    type: array
    description: Non-transient causes; jobs may appear in several causes.
    items:
      $ref: "#/$defs/group"
$defs:
  job:
    type: object
    required: [workflow_name, job_name, job_run_url]
    properties:
      workflow_name:
        description: Name of the GitHub Actions run (`run.name`).
        type: string
        minLength: 1
      job_name:
        description: Name of the failed job (`job.name`).
        type: string
        minLength: 1
      job_run_url:
        description: Attempt-pinned URL of the failed GitHub Actions job.
        type: string
        pattern: '^https://github\.com/mlflow/mlflow/actions/runs/[0-9]+/attempts/[0-9]+/job/[0-9]+$'
  group:
    type: object
    required: [verdict, summary, jobs, evidence, uncertainties]
    properties:
      verdict:
        # new: investigated problem without a matching open nightly issue.
        # already_reported: matches an open nightly issue.
        # uncertain: insufficient evidence or an incomplete investigation.
        enum: [new, already_reported, uncertain]
      summary:
        type: string
        minLength: 1
      jobs:
        type: array
        minItems: 1
        uniqueItems: true
        items:
          $ref: "#/$defs/job"
      evidence:
        type: array
        minItems: 1
        items:
          type: string
          minLength: 1
      uncertainties:
        # Unverified mechanisms and limits of the investigation.
        type: array
        items:
          type: string
          minLength: 1
      title:
        # The publisher builds issue bodies from the other report fields.
        type: string
        minLength: 1
        maxLength: 200
        pattern: '^[^\r\n]+$'
      issue_number:
        type: integer
        minimum: 1
    allOf:
      - if:
          properties:
            verdict:
              const: new
        then:
          required: [title]
      - if:
          properties:
            verdict:
              const: already_reported
        then:
          required: [issue_number]
